name: Budowa aplikacji iOS

# Uruchamia się przy pushu na main oraz na żądanie (zakładka Actions -> "Budowa aplikacji iOS" -> Run workflow).
on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Wybór środowiska Xcode
        run: |
          echo "Dostępne wersje Xcode na runnerze:"
          ls -d /Applications/Xcode*.app || true
          XC=$( (ls -d /Applications/Xcode_26.1*.app 2>/dev/null || true) | sort -V | tail -1 )
          if [ -z "$XC" ]; then
            XC=$( (ls -d /Applications/Xcode_26*.app 2>/dev/null || true) | sort -V | tail -1 )
          fi
          if [ -z "$XC" ]; then
            XC=$( (ls -d /Applications/Xcode_16*.app 2>/dev/null || true) | sort -V | tail -1 )
          fi
          if [ -n "$XC" ]; then
            echo "Wybieranie Xcode: $XC"
            sudo xcode-select -s "$XC"
          else
            echo "::warning::Używam domyślnego Xcode na runnerze."
          fi
          xcodebuild -version
          echo "--- Dostępne SDK ---"
          xcodebuild -showsdks || true
          echo "--- Runtimes symulatora ---"
          xcrun simctl list runtimes || true
          echo "--- Dostępne symulatory iPhone ---"
          xcrun simctl list devices available | grep -i "iPhone" | head -15 || true

      - name: Instalacja XcodeGen
        run: brew install xcodegen

      - name: Generowanie projektu, kompilacja, symulator i zrzuty ekranu
        run: bash scripts/ci_verify.sh

      - name: Zapis projektu Xcode jako artefakt
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: |
            iOSZadania.xcodeproj
            Zadanie1
            Zadanie2
            Zadanie3
            Zadanie4
            project.yml

      - name: Zapis zrzutów ekranu (screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: shots
          if-no-files-found: ignore

      - name: Zapis paczek aplikacji symulatora (simulator-apps)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-apps
          path: dist
