name: iOSZadania

options:
  bundleIdPrefix: edu.pb.wi
  developmentLanguage: pl
  xcodeVersion: "16.0"          # Format pliku projektu (zgodny z Xcode 16.x i nowszymi)
  deploymentTarget:
    iOS: "17.0"                 # IPHONEOS_DEPLOYMENT_TARGET = 17.0 (wymagane przez onChange z 2 parametrami oraz MagnifyGesture)
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"          # Kompilator Swift działający w trybie zgodności ze Swift 5
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

targets:
  Zadanie1:
    type: application
    platform: iOS
    sources:
      - path: Zadanie1
        excludes:
          - "*.pdf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.pb.wi.Zadanie1
        INFOPLIST_KEY_CFBundleDisplayName: "Zadanie 1"

  Zadanie2:
    type: application
    platform: iOS
    sources:
      - path: Zadanie2      # zawiera Assets.xcassets oraz en.lproj / pl.lproj
        excludes:
          - "*.pdf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.pb.wi.Zadanie2
        INFOPLIST_KEY_CFBundleDisplayName: "Zadanie 2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  Zadanie3:
    type: application
    platform: iOS
    sources:
      - path: Zadanie3
        excludes:
          - "*.pdf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.pb.wi.Zadanie3
        INFOPLIST_KEY_CFBundleDisplayName: "Zadanie 3"
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Aplikacja wyświetla Twoje współrzędne geograficzne oraz adres."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Aplikacja wyświetla Twoje współrzędne geograficzne oraz adres."

  Zadanie4:
    type: application
    platform: iOS
    sources:
      - path: Zadanie4
        excludes:
          - "*.pdf"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.pb.wi.Zadanie4
        INFOPLIST_KEY_CFBundleDisplayName: "Zadanie 4"
