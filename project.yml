name: iOSZadania

options:
  bundleIdPrefix: edu.pb.wi
  developmentLanguage: en
  xcodeVersion: "16.0"          # project file format; lower it if the lab Xcode is older than 16
  deploymentTarget:
    iOS: "17.0"                 # onChange(of:) with 2 params and MagnifyGesture need iOS 17
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait

targets:
  Zadanie1:
    type: application
    platform: iOS
    sources:
      - path: Zadanie1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: edu.pb.wi.Zadanie1
        INFOPLIST_KEY_CFBundleDisplayName: "Zadanie 1"

